[package]
name = "turboquant_index"
description = "TurboQuant-style compressed vector index (bit-packed embeddings, cosine top-k). Benchmarks time approximate quantized search versus exact brute-force cosine on the same vectors as dense fp32."
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
wide = "0.7"
statrs = "0.17"
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "recall"
path = "src/bin/recall.rs"

[[bin]]
name = "food_reviews_bench"
path = "src/bin/food_reviews_bench.rs"
