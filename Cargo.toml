[workspace]
resolver = "2"
members = ["turboquant_index"]

[package]
name = "turboquant_index"
description = "TurboQuant compressed vector index (bit-packed embeddings, cosine top-k). Benchmarks time approximate quantized search versus exact brute-force cosine on the same vectors as dense fp32."
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
wide = "0.7"
statrs = "0.17"
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray-npy = { version = "0.9.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(target_os = "linux")'.dependencies]
blas-src = { version = "0.10", features = ["openblas"] }
openblas-src = { version = "0.10", default-features = false, features = ["system"] }

[[bin]]
name = "recall"
path = "src/bin/recall.rs"

[[bin]]
name = "food_reviews_bench"
path = "src/bin/food_reviews_bench.rs"

[[bin]]
name = "export_csv_split"
path = "src/bin/export_csv_split.rs"

[[bin]]
name = "glove_angular_bench"
path = "src/bin/glove_angular_bench.rs"
